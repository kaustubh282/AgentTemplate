[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protec-insurance-ai-template"
version = "0.1.0"
description = "Production-oriented base template for ProTec Insurance AI assistants (FAQ + deterministic UI-directive orchestration)."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.9",
    "strands-agents>=1.0",
    "PyYAML>=6.0",
    "redis>=5.0",
    "opentelemetry-sdk>=1.20",
]

[project.optional-dependencies]
# OTLP/HTTP span export. Without it OTEL_ENABLED=true still traces in-process; setting
# OTEL_EXPORTER_OTLP_ENDPOINT without this extra fails startup (otel_exporter_not_installed).
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "fakeredis>=2.20",
]
evals = [
    "ragas>=0.2",
    "deepeval>=1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "security: adversarial and security tests",
    "performance: latency / token / cost benchmark tests",
    "contract: provider and schema contract tests",
    "e2e: end-to-end demo scenarios",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = ["B008", "S101", "RUF012", "S105", "S106", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"evals/**" = ["S", "E501"]
"scripts/**" = ["S", "E501", "T201"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = []
